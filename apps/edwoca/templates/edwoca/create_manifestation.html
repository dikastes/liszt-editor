{% extends 'edwoca/base.html' %}

{% load i18n %}

{% block content %}
    <h2>
        {{ view_title }}
    </h2>

    {% if form %}
        <form method="post" class="mt-5">
            {% csrf_token %}
            {{ form.as_daisy }}
            <input type="submit" id="submit-form" class="hidden">
        </form>
    {% endif %}

{% endblock %}
