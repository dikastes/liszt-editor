{% load i18n %}
<div class="flex flex-col h-full">
    <ul class="menu p-0 flex-1">
        <li>
            <a
            href="{% url 'edwoca:library_update' object.id %}"
            {% if 'update' in request.path %}class="active"{% endif %}
            >
            {% translate 'data' %}
            </a>
        </li>
        <li>
            <a
            href="{% url 'edwoca:library_manuscripts' object.id %}"
            {% if 'manuscripts' in request.path %}class="active"{% endif %}
            >
            {% translate 'manuscripts' %}
            </a>
        </li>
        <li>
            <a
            href="{% url 'edwoca:library_prints' object.id %}"
            {% if 'prints' in request.path %}class="active"{% endif %}
            >
            {% translate 'prints' %}
            </a>
        </li>
    </ul>
    <div class="flex-0 min-h-16"></div>
    <ul class="menu p-0 flex-0">
        <li>
            <a href="{% url 'edwoca:library_delete' object.id %}"
            {% if 'delete' in request.path %}class="active"{% endif %}
            >
                {% translate 'delete' %}
            </a>
        </li>
        <li>
            <a href="{% url 'edwoca:library_list' %}">
                {% translate 'back' %}
            </a>
        </li>
    </ul>
</div>
